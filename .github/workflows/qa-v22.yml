name: QA V2.2 - Sala de Decisiones y Contacto
on:
  push:
    branches: [main]
    paths:
      - 'qa/qa_v22_prod.py'
      - '.github/workflows/qa-v22.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas de producción
        env:
          PORTAL_URL: https://pedroalread.github.io/laboratorio-de-producto-pedro/
        run: python qa/qa_v22_prod.py
      - name: Conservar resultados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-qa-v22
          path: |
            qa/qa-v22-production.json
            qa/screenshots/
          if-no-files-found: ignore
